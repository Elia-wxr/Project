# Tarot JupyterLab plugin packaging configuration.
#
# Owned by the project Owner (负责人): builds, dependency declarations and
# the mapping of generated frontend artifacts into the wheel.  The frontend
# sources themselves are maintained by Agent C under 'frontend/'; the build
# hook below deliberately fails when the required artifacts are missing or
# stale, so a backend-only package can never be published.
#
# Reference: official JupyterLab extension template
# https://github.com/jupyterlab/extension-template

[build-system]
requires = [
    "hatchling>=1.21.0",
    "hatch-jupyter-builder>=0.5",
    "jupyter-builder>=1.2.0,<2",
]
build-backend = "hatchling.build"

[project]
name = "tarot-jupyterlab"
description = "A JupyterLab sidebar extension for browsing a 78-card tarot deck, casting spreads, saving history and generating AI readings."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["Jupyter", "JupyterLab", "tarot"]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

# Runtime dependencies.  The shared models, errors and the AI module use the
# standard library only; 'jupyter_server' is required for the server
# extension entry point provided by Agent C.
dependencies = [
    "jupyter_server>=2.13.0,<3",
]

[project.optional-dependencies]
# Everything the development workflow uses (third-party packages used by
# tests, linting, type checking and packaging are declared here).
dev = [
    "build>=1.2",
    "jupyterlab>=4,<5",
    "jupyter-builder>=1.2.0,<2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.370",
    "ruff>=0.6",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-jupyter[server]>=0.6.0",
]

[tool.hatch.version]
path = "src/tarot_jupyterlab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tarot_jupyterlab"]

[tool.hatch.build.targets.wheel.shared-data]
# The prebuilt labextension (generated by the frontend build in 'frontend/')
# and the server enablement config are installed into the Jupyter data dirs.
"src/tarot_jupyterlab/labextension" = "share/jupyter/labextensions/tarot-jupyterlab"
"jupyter-config/jupyter_server_config.d/tarot_jupyterlab.json" = "etc/jupyter/jupyter_server_config.d/tarot_jupyterlab.json"

[tool.hatch.build.targets.wheel.force-include]
# Package the single source of truth files as importable package resources so
# runtime code never depends on the current working directory.
"card_set.json" = "tarot_jupyterlab/static/card_set.json"
"schemas/tarot.schema.json" = "tarot_jupyterlab/schemas/tarot.schema.json"

[tool.hatch.build.targets.sdist]
# sdist must contain every input required to rebuild the wheel from source:
# Python sources, the card library, frontend sources and lock file, the JSON
# schema and the server enablement config.
artifacts = ["src/tarot_jupyterlab/labextension"]
include = [
    "src",
    "frontend",
    "schemas",
    "jupyter-config",
    "tests",
    "docs",
    "card_set.json",
    "README.md",
    "Plan.md",
]
exclude = [".github"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "src/tarot_jupyterlab/labextension/static/style.js",
    "src/tarot_jupyterlab/labextension/package.json",
]
skip-if-exists = ["src/tarot_jupyterlab/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "frontend"
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
path = "frontend"
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "src/tarot_jupyterlab/labextension"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
exclude = ["frontend", "tests", "docs"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
